services:

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-data-warehouse
    user: root
    restart: unless-stopped

    ports:
      - "8081:8080"
      - "50000:50000"

    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    entrypoint:
      - /bin/bash
      - -c
      - |
        apt-get update && \
        apt-get install -y git curl build-essential docker.io && \
        exec /usr/bin/tini -- /usr/local/bin/jenkins.sh

    networks:
      - bigdata

volumes:
  jenkins_home:

networks:
  bigdata:
    external: true